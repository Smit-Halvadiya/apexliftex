kind = "web"
previewPath = "/"
title = "Apex Belts"
description = "A premium B2B industrial website for Apex Belts, showcasing engineered load-securing products, applications, quality, resources, and quote inquiries for international customers."
version = "1.0.0"
id = "artifacts/apex-belts"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22283

[services.development]
run = "pnpm --filter @workspace/apex-belts run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/apex-belts", "run", "build" ]
serve = "static"
publicDir = "artifacts/apex-belts/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22283"
BASE_PATH = "/"
