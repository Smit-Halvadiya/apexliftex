kind = "web"
previewPath = "/"
title = "Apex Liftex"
description = "A premium B2B industrial website for Apex Liftex, showcasing load-securing belts, components, applications, product imagery, and quote inquiries."
version = "1.0.0"
id = "artifacts/apex-belts"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22283

[services.development]
run = "pnpm --filter @workspace/apex-belts run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/apex-belts", "run", "build" ]
serve = "static"
publicDir = "artifacts/apex-belts/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22283"
BASE_PATH = "/"
